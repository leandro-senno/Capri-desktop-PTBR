# Capri para Android (Flutter): compila o APK a partir da pasta mobile/.
# O APK fica em Actions > (esta execução) > Artifacts > capri-android.
name: Android (Flutter)

on:
  push:
    branches: [flutter-android]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar a pasta do Android
        run: |
          flutter create --platforms=android --org com.leandrosenno --project-name capri .
          rm -rf test
          git checkout -- .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: capri-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
