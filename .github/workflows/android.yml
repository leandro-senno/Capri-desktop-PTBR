# Capri para Android (Flutter): compila o APK a partir da pasta mobile/.
# O APK fica em Actions > (esta execução) > Artifacts > capri-android.
name: Android (Flutter)

on:
  push:
    branches: [flutter-android]
    paths: ['mobile/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Gerar a pasta do Android
        run: |
          flutter create --platforms=android --org com.leandrosenno --project-name capri .
          rm -rf test
          git checkout -- .
          # Modelo de fala offline da palavra de ativação (32 MB), posto dentro do app para o celular não precisar baixar.
          curl -fsSL --retry 5 --retry-delay 5 -o /tmp/vosk.zip https://huggingface.co/rhasspy/vosk-models/resolve/main/pt/vosk-model-small-pt-0.3.zip \
            || curl -fsSL --retry 5 --retry-delay 5 -o /tmp/vosk.zip https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip
          rm -rf /tmp/vosk && unzip -q /tmp/vosk.zip -d /tmp/vosk
          mdl=$(find /tmp/vosk -path '*/am/final.mdl' | head -1)
          test -n "$mdl"
          mkdir -p android/app/src/main/assets
          rm -rf android/app/src/main/assets/vosk-pt
          cp -r "$(dirname "$(dirname "$mdl")")" android/app/src/main/assets/vosk-pt
          find android/app/src/main/assets/vosk-pt -type f | head -40
          du -sh android/app/src/main/assets/vosk-pt
          # Ouvido offline da palavra de ativação (Vosk) e as regras do R8 para ele.
          cat >> android/app/build.gradle.kts <<'EOT'

          dependencies {
              implementation("net.java.dev.jna:jna:5.13.0@aar")
              implementation("com.alphacephei:vosk-android:0.3.47@aar")
          }

          android {
              buildTypes {
                  getByName("release") {
                      proguardFiles("proguard-rules.pro")
                  }
              }
          }
          EOT
      # Guarda a chave de assinatura entre as compilações, para o APK novo instalar por cima do antigo
      # sem apagar os dados (o cérebro baixado). Se o cache expirar, a chave muda e é preciso reinstalar.
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: capri-assinatura-v1
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      # O motor do cérebro local (LiteRT-LM) só existe para arm64, que é o caso do S25 FE.
      - run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: capri-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
