name: capri
description: Capri no bolso - versão Android (Flutter) da companheira de desktop Capri, em português do Brasil.
publish_to: none
version: 0.6.0+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^9.2.2
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  flutter_overlay_window: ^0.5.0
  flutter_gemma: ^1.8.0
  flutter_gemma_litertlm: any
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sprites/
    - assets/voice/
  fonts:
    - family: ShareTechMono
      fonts:
        - asset: assets/fonts/ShareTechMono-Regular.ttf
